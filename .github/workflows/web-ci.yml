name: web-ci

# Build and lint gate for the panel (the theme that ships inside the server).
# Remote command, terminal, and Agent file UI are intentionally absent. The
# panel must compile, lint, and pass the static removal guard before publishing.

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Enforce immutable third-party Actions
        run: python3 .github/scripts/check-workflow-pins.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Verify server update detection
        run: npm run test:server-updates

      - name: Guard removed remote-control UI
        run: npm run test:remote-control-removed

      - name: Build (type check + bundle)
        run: npm run build

      - name: Verify Service Worker navigation fallback excludes core routes
        run: npm run test:sw-routes

      - name: Verify the locale files stay in sync
        run: npm run i18n:sync:dry

  required-gate:
    name: required-gate
    if: ${{ always() }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Require the deterministic frontend build
        run: test "${{ needs.build.result }}" = success
